    <main>
      <section class="page-hero" id="page-hero-root">
        <img class="hero-bg" src="assets/stock/brands-hero.jpg" alt="" />
        <div class="wrap">
          <p class="eyebrow"><span></span></p>
          <h1></h1>
          <p class="hero-body"></p>
        </div>
      </section>

      <section class="section-pad brands-section">
        <div class="wrap">
          <!-- 자사 / 수입 브랜드를 한 페이지에서 보여주고, 탭으로 걸러본다 -->
          <div class="brand-filter-wrap">
            <div class="brand-filter-bar" id="brand-filter">
              <button class="brand-filter-btn active" type="button" data-filter="all">
                <span class="label"></span><span class="label-short"></span><span class="count"></span>
              </button>
              <button class="brand-filter-btn" type="button" data-filter="own">
                <span class="label"></span><span class="label-short"></span><span class="count"></span>
              </button>
              <button class="brand-filter-btn" type="button" data-filter="imported">
                <span class="label"></span><span class="label-short"></span><span class="count"></span>
              </button>
            </div>
          </div>

          <div class="brand-group" id="own-group">
            <div class="brand-group-head">
              <div>
                <span class="brand-group-tag">DOMESTIC PREMIUM BRANDS</span>
                <h2 class="brand-group-title"></h2>
              </div>
              <p class="brand-group-desc"></p>
            </div>
            <div class="brand-own-grid" id="own-grid"></div>
          </div>

          <div class="brand-group" id="imported-group">
            <div class="brand-group-head">
              <div>
                <span class="brand-group-tag imported">GLOBAL IMPORTED BRANDS</span>
                <h2 class="brand-group-title"></h2>
              </div>
              <p class="brand-group-desc"></p>
            </div>
            <div class="brand-imported-grid" id="imported-grid"></div>
          </div>
        </div>
      </section>
